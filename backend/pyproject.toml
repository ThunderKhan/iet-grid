[project]
name = "iet-grid-api"
version = "1.0.0"
description = "IET Grid campus scheduling API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.9",
  "uvicorn==0.34.2"
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.24,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
